<!DOCTYPE html>
<html lang="en">
<head>

<title>Lanternmere — opening spike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fbf0d6;
    --ink-soft: #ecd9b2;
    --gold: #e8bf6e;
    --gold-deep: #b9853a;
    --umber: #2a170b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #140b06; overflow: hidden; }
  body { font-family: 'Cormorant Garamond', Georgia, serif; color: var(--ink); }

  .stage { position: fixed; inset: 0; overflow: hidden; }
  .scene { position: absolute; inset: 0; animation: drift 70s ease-in-out infinite alternate; transform-origin: 50% 70%; filter: contrast(1.16) brightness(.95) saturate(1.04); }
  @keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.08) translateY(-0.6%); } }
  .paint, .water, .sky { position: absolute; inset: 0; background: url(/files/lantern-mere.jpg) center / cover no-repeat; }
  .sky { inset: 0 -4%; -webkit-mask: linear-gradient(180deg, #000 0%, #000 22%, transparent 31%); mask: linear-gradient(180deg, #000 0%, #000 22%, transparent 31%);
    animation: clouds 38s ease-in-out infinite alternate; filter: url(#billow); }
  @keyframes clouds { from { transform: translateX(-3.6%); } to { transform: translateX(3.6%); } }
  /* The lake below the horizon wavers; the sky and shore stay still. */
  .water { filter: url(#ripple); -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><filter id='f'><feGaussianBlur stdDeviation='1.2'/></filter><filter id='g'><feGaussianBlur stdDeviation='.5'/></filter><filter id='c' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='2.2'/></filter><mask id='m'><polygon filter='url(%23f)' fill='white' points='14,66 86,66 97,73 90,79 79,82 75,90 69,100 44,100 40,92 33,85 16,81 6,75'/><ellipse cx='50' cy='86' rx='7.5' ry='10' fill='%23222' filter='url(%23c)'/><g fill='black' filter='url(%23g)'><ellipse cx='50' cy='69' rx='4.3' ry='12'/><rect x='46.4' y='71' width='7.2' height='10' rx='1'/><ellipse cx='55.6' cy='67.1' rx='1.5' ry='2.6'/><ellipse cx='44.9' cy='71.9' rx='1.5' ry='2.6'/><ellipse cx='54.5' cy='72.8' rx='1.5' ry='2.6'/><ellipse cx='63.3' cy='81.1' rx='1.5' ry='2.6'/><ellipse cx='55.6' cy='80.3' rx='1.5' ry='2.6'/><ellipse cx='40.4' cy='80.3' rx='1.5' ry='2.6'/></g></mask><rect width='100' height='100' fill='white' mask='url(%23m)'/></svg>") 0 0 / 100% 100% no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><filter id='f'><feGaussianBlur stdDeviation='1.2'/></filter><filter id='g'><feGaussianBlur stdDeviation='.5'/></filter><filter id='c' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='2.2'/></filter><mask id='m'><polygon filter='url(%23f)' fill='white' points='14,66 86,66 97,73 90,79 79,82 75,90 69,100 44,100 40,92 33,85 16,81 6,75'/><ellipse cx='50' cy='86' rx='7.5' ry='10' fill='%23222' filter='url(%23c)'/><g fill='black' filter='url(%23g)'><ellipse cx='50' cy='69' rx='4.3' ry='12'/><rect x='46.4' y='71' width='7.2' height='10' rx='1'/><ellipse cx='55.6' cy='67.1' rx='1.5' ry='2.6'/><ellipse cx='44.9' cy='71.9' rx='1.5' ry='2.6'/><ellipse cx='54.5' cy='72.8' rx='1.5' ry='2.6'/><ellipse cx='63.3' cy='81.1' rx='1.5' ry='2.6'/><ellipse cx='55.6' cy='80.3' rx='1.5' ry='2.6'/><ellipse cx='40.4' cy='80.3' rx='1.5' ry='2.6'/></g></mask><rect width='100' height='100' fill='white' mask='url(%23m)'/></svg>") 0 0 / 100% 100% no-repeat; }

  .glow { position: absolute; left: 50%; top: 69%; width: 34vmax; height: 34vmax; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 214, 140, .55) 0%, rgba(255, 170, 70, .22) 22%, rgba(255, 140, 40, 0) 60%);
    mix-blend-mode: screen; animation: breathe 5.5s ease-in-out infinite, flicker 2.3s steps(1) infinite; }
  @keyframes breathe { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }
  @keyframes flicker { 0%, 100% { filter: brightness(1); } 37% { filter: brightness(1.08); } 41% { filter: brightness(.96); } 73% { filter: brightness(1.05); } }
  .stage.awake .glow { animation: breathe 5.5s ease-in-out infinite, flicker 2.3s steps(1) infinite, wake 1.6s ease-out 1; }
  @keyframes wake { 0% { opacity: .8; } 30% { opacity: 1.6; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: .9; } }

  .ring { position: absolute; left: 50%; top: 77.6%; width: 3vw; aspect-ratio: 5 / 1; border: 1px solid rgba(255, 210, 130, .7); border-radius: 50%;
    transform: translate(-50%, -50%) scale(.4); opacity: 0; animation: ring 7.5s cubic-bezier(.2, .6, .3, 1) infinite; }
  .ring:nth-child(2) { animation-delay: 2.5s; } .ring:nth-child(3) { animation-delay: 5s; }
  @keyframes ring { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 12% { opacity: .75; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(7); } }

  .mist { position: absolute; left: -30%; width: 160%; height: 9%; top: 56%; filter: blur(14px); opacity: .32;
    background: radial-gradient(ellipse 22% 60% at 20% 50%, #e9cdb4, transparent 70%), radial-gradient(ellipse 18% 50% at 62% 55%, #dcbfa8, transparent 70%), radial-gradient(ellipse 20% 55% at 88% 45%, #e6c9b0, transparent 70%);
    animation: mist 48s linear infinite alternate; }
  .mist.b { top: 60%; opacity: .2; animation-duration: 66s; animation-direction: alternate-reverse; }
  @keyframes mist { from { transform: translateX(-6%); } to { transform: translateX(6%); } }

  .twinkle { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: screen; pointer-events: none; }
  .twinkle circle { opacity: 0; animation: twinkle 9s ease-in-out infinite; }
  /* Mostly resting; a brief, faint swell — like a candle passing a window. */
  @keyframes twinkle { 0%, 70%, 100% { opacity: 0; } 80% { opacity: .55; } 86% { opacity: .2; } 90% { opacity: .45; } }
  .puffs { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .32; mix-blend-mode: screen; pointer-events: none; }
  .puffs .drift { animation: puffdrift 85s ease-in-out infinite alternate; will-change: transform; }
  @keyframes puffdrift { from { transform: translateX(-90px); } to { transform: translateX(90px); } }
  .fog { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .42; pointer-events: none; }
  .fog .drift { animation: fog 140s ease-in-out infinite alternate; will-change: transform; }
  .fog .drift.b { animation: fog 200s ease-in-out infinite alternate-reverse; }
  @keyframes fog { from { transform: translateX(-200px); } to { transform: translateX(200px); } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 72% 66% at 50% 58%, transparent 48%, rgba(16, 6, 2, .7) 100%),
                linear-gradient(180deg, rgba(22, 8, 18, .45) 0%, transparent 32%),
                linear-gradient(0deg, rgba(14, 5, 2, .4) 0%, transparent 18%); }

  /* ---- UI ---- */
  .ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  .title { position: relative; isolation: isolate; margin-top: 13vh; text-align: center; transition: transform 1.2s cubic-bezier(.2, .7, .2, 1); }
  .stage.awake .title { transform: translateY(-7vh) scale(.72); }
  .kicker { font-family: 'Cormorant SC', serif; font-weight: 600; letter-spacing: .32em; font-size: clamp(11px, 1vw, 14px); color: var(--ink-soft); margin: 0 0 .9em .32em; }
  h1 { margin: 0; font-weight: 400; font-size: clamp(48px, 7.4vw, 112px); letter-spacing: .05em; line-height: 1; color: var(--ink);
    text-shadow: 0 2px 18px rgba(0, 0, 0, .4); }
  .title::before { content: ''; position: absolute; left: 50%; top: 50%; width: 150%; height: 200%; transform: translate(-50%, -50%); z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 48% 44% at 50% 50%, rgba(255, 160, 86, .4), rgba(240, 112, 62, .17) 50%, rgba(200, 80, 50, 0) 78%); filter: blur(14px);
    animation: dusk 9s ease-in-out infinite; }
  @keyframes dusk { 0%, 100% { opacity: .85; } 50% { opacity: 1; } }

  .flourish { display: block; margin: 1.1em auto 0; width: clamp(240px, 26vw, 420px); height: auto; }
  .line { fill: none; stroke: #f0cc84; stroke-width: 1; stroke-linecap: round; }
  .flourish { filter: drop-shadow(0 0 2px rgba(255, 196, 110, .75)) drop-shadow(0 0 7px rgba(255, 160, 80, .35)); }
  .dot { fill: #ffe3a3; }

  .press { position: absolute; top: 41vh; font-family: 'Cormorant SC', serif; font-weight: 500; letter-spacing: .5em; font-size: clamp(15px, 1.35vw, 20px); color: var(--ink);
    animation: press 3.6s ease-in-out infinite; transition: opacity .6s; }
  @keyframes press { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  .stage.awake .press { opacity: 0; animation: none; pointer-events: none; }

  .menu { margin-top: -5vh; display: flex; flex-direction: column; align-items: center; gap: 11px; opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity 1s .35s, transform 1.2s .35s cubic-bezier(.2, .7, .2, 1); }
  .stage.awake .menu { opacity: 1; transform: none; pointer-events: auto; }

  .vbtn { position: relative; display: grid; gap: 2px; width: clamp(270px, 22vw, 350px); padding: 11px 28px 12px; text-align: center; cursor: pointer;
    font-family: inherit; color: var(--ink); background: linear-gradient(180deg, rgba(36, 16, 10, .58), rgba(22, 9, 5, .7));
    border: 1px solid rgba(232, 191, 110, .6); border-radius: 1px; outline: 1px solid rgba(232, 191, 110, .22); outline-offset: -5px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: border-color .4s, background .4s; }
  .vbtn strong { font-weight: 600; font-size: clamp(19px, 1.5vw, 23px); letter-spacing: .04em; }
  .vbtn small { font-size: clamp(13px, 1vw, 15px); font-style: italic; color: var(--ink-soft); }
  .vbtn:hover, .vbtn:focus-visible { border-color: rgba(246, 214, 146, .95); outline-color: rgba(246, 214, 146, .45); background: linear-gradient(180deg, rgba(58, 26, 14, .66), rgba(30, 12, 6, .76)); }
  .vbtn .vine { position: absolute; top: 50%; width: 74px; height: 54px; transform: translateY(-50%); overflow: visible; pointer-events: none; }
  .vbtn .vine.l { right: calc(100% - 6px); }
  .vbtn .vine.r { left: calc(100% - 6px); transform: translateY(-50%) scaleX(-1); }
  .vbtn .vine { opacity: 0; clip-path: inset(0 0 0 100%); transition: opacity .5s, clip-path 1.1s cubic-bezier(.3, .6, .2, 1); }
  .vbtn .vine.r { clip-path: inset(0 0 0 100%); }
  .vbtn:hover .vine, .vbtn:focus-visible .vine, .vbtn.lead .vine { opacity: 1; clip-path: inset(0 0 0 0); }

  .corner { position: absolute; top: 18px; right: 22px; display: flex; gap: 22px; opacity: 0; transition: opacity 1s .8s; }
  .stage.awake .corner { opacity: 1; }
  .corner button { background: none; border: 0; padding: 6px 2px; cursor: pointer; font-family: 'Cormorant SC', serif; font-weight: 600; letter-spacing: .28em; font-size: 13px; color: var(--ink-soft); }
  .corner button:hover { color: var(--ink); }

  .label { position: fixed; top: 12px; left: 12px; font: 12px/1.4 system-ui, sans-serif; color: #f3dfb8; background: rgba(20, 10, 4, .7); padding: 6px 10px; border-radius: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .scene, .glow, .ring, .mist, .press, .sky, .twinkle circle, .title::before, .fog .drift, .puffs .drift { animation: none !important; }
    .ring { opacity: 0; }
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

      </feTurbulence>

<div class="label">Throwaway spike · press any key or click · names and save line are placeholders</div>

<script>
  const stage = document.getElementById('stage');
  const wake = () => stage.classList.add('awake');
  addEventListener('keydown', wake, { once: true });
  stage.addEventListener('click', wake, { once: true });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('sparks'), cx = cv.getContext('2d');
  let W, H, parts = [];
  const fit = () => { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; };
  fit(); addEventListener('resize', fit);
  // Sparks rise from the lantern; a few slower fireflies wander over the lake.
  const spark = () => ({ x: W * (0.5 + (Math.random() - .5) * .03), y: H * (0.69 + Math.random() * .03), vx: (Math.random() - .5) * .25, vy: -(.25 + Math.random() * .55),
    r: (.7 + Math.random() * 1.5) * devicePixelRatio, life: 0, max: 380 + Math.random() * 420, tw: Math.random() * 6.28, kind: 's' });
  const fly = () => ({ x: W * Math.random(), y: H * (0.6 + Math.random() * .3), vx: (Math.random() - .5) * .2, vy: (Math.random() - .5) * .12,
    r: (.8 + Math.random() * 1.2) * devicePixelRatio, life: 0, max: 600 + Math.random() * 600, tw: Math.random() * 6.28, kind: 'f' });
  for (let i = 0; i < 26; i++) { const p = spark(); p.life = Math.random() * p.max; p.y -= p.vy * -p.life; parts.push(p); }
  for (let i = 0; i < 14; i++) parts.push(fly());
  function frame() {
    cx.clearRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    for (const p of parts) {
      p.life++; p.tw += .05;
      p.x += p.vx + Math.sin(p.tw * .6) * .15; p.y += p.vy;
      const t = p.life / p.max, fade = Math.min(1, t * 6) * (1 - t);
      const a = fade * (.55 + .45 * Math.sin(p.tw));
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
      g.addColorStop(0, `rgba(255,240,200,${a})`); g.addColorStop(.3, `rgba(255,196,96,${a * .6})`); g.addColorStop(1, 'rgba(255,150,50,0)');
      cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 6.283); cx.fill();
      if (p.life > p.max) Object.assign(p, p.kind === 's' ? spark() : fly());
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
</script>
